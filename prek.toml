default_install_hook_types = ["pre-commit", "commit-msg"]
exclude = '^\.(claude|opencode|kilo|agents)/'

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-yaml" },
  { id = "end-of-file-fixer" },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-illegal-windows-names" },
  { id = "check-json" },
  { id = "check-json5" },
  { id = "check-merge-conflict" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-symlinks" },
  { id = "check-toml" },
  { id = "check-vcs-permalinks" },
  { id = "check-xml" },
  { id = "destroyed-symlinks" },
  { id = "detect-private-key" },
  { id = "file-contents-sorter" },
  { id = "fix-byte-order-marker" },
  { id = "forbid-new-submodules" },
  { id = "mixed-line-ending" },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "golangci-lint"
name = "golangci-lint"
language = "system"
entry = "golangci-lint run"
types = ["go"]
pass_filenames = false
priority = 0

[[repos.hooks]]
id = "go-test"
name = "go test"
language = "system"
entry = "go test ./..."
types = ["go"]
pass_filenames = false
priority = 0

[[repos.hooks]]
id = "govulncheck"
name = "govulncheck"
language = "system"
entry = "govulncheck ./..."
types = ["go"]
pass_filenames = false
priority = 0

[[repos.hooks]]
id = "actionlint"
name = "actionlint"
language = "system"
entry = "actionlint"
files = "^\\.github/workflows/.*\\.ya?ml$"
pass_filenames = false
priority = 0

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.50.1"
hooks = [{ id = "typos", priority = 0 }]

[[repos]]
repo = "https://github.com/crate-ci/committed"
rev = "v1.1.11"
hooks = [{ id = "committed", priority = 0 }]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [{ id = "gitleaks", priority = 0 }]
